<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบปักหมุดรายงานระดับน้ำ จ.ราชบุรี</title>
    <!-- โหลด Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- โหลด ฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- โหลด Leaflet CSS & JS (แผนที่ฟรี) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #023e8a;
            font-size: 1.3em;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instruction {
            background: #e0f2fe;
            color: #0369a1;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #map {
            width: 100%;
            height: 480px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            z-index: 1;
        }

        /* ตกแต่งฟอร์มในป๊อปอัปแผนที่ */
        .popup-form {
            font-family: 'Prompt', sans-serif;
            padding: 5px;
            width: 240px;
        }

        .popup-form h4 {
            margin: 0 0 8px 0;
            color: #023e8a;
            font-size: 1em;
        }

        .popup-form label {
            font-size: 0.82em;
            color: #475569;
            display: block;
            margin-top: 8px;
        }

        .popup-form input, .popup-form select {
            width: 100%;
            padding: 6px 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            font-size: 0.85em;
        }

        /* กล่องแจ้งเตือนการแนบรูปสำหรับระดับวิกฤต */
        .photo-upload-box {
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อเลือกวิกฤตเท่านั้น */
            margin-top: 8px;
            padding: 8px;
            background: #fef2f2;
            border: 1px dashed #ef4444;
            border-radius: 8px;
        }

        .photo-upload-box label {
            color: #dc2626;
            font-weight: 600;
            margin-top: 0;
        }

        .img-preview {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }

        .popup-form button {
            width: 100%;
            background: #00b4d8;
            color: white;
            border: none;
            padding: 8px;
            margin-top: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
        }

        .popup-form button:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-map-location-dot" style="color: #0077b6;"></i> แผนที่ปักหมุดระดับน้ำ จ.ราชบุรี</h1>
    
    <div class="instruction">
        <i class="fa-solid fa-hand-pointer"></i>
        <span><strong>วิธีใช้งาน:</strong> แตะหรือคลิกจุดบนแผนที่เพื่อปักหมุด (หากเลือกระดับวิกฤต ต้องถ่ายภาพสถานที่จริง)</span>
    </div>

    <!-- แผนที่ -->
    <div id="map"></div>
</div>

<script>
    const ratchaburiCoords = [13.5358, 99.8153];
    const map = L.map('map').setView(ratchaburiCoords, 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let tempMarker = null;
    let currentPhotoData = null; // ตัวแปรเก็บไฟล์/DataURL ของรูปถ่าย

    // เมื่อคลิกบนแผนที่
    map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);

        if (tempMarker) {
            map.removeLayer(tempMarker);
        }
        currentPhotoData = null;

        const formContent = `
            <div class="popup-form">
                <h4>📍 ปักหมุดแจ้งระดับน้ำ</h4>
                <label>ชื่อจุดสังเกต / สถานที่:</label>
                <input type="text" id="locationName" placeholder="เช่น หน้าวัด, ซอย 2" required>
                
                <label>ระดับน้ำปัจจุบัน:</label>
                <select id="waterLevel" onchange="checkCriticalLevel()">
                    <option value="green">🟢 ปกติ / แห้งขอด</option>
                    <option value="yellow">🟡 ระดับตาตุ่ม - แข้ง (10-20 ซม.)</option>
                    <option value="orange">🟠 ระดับเข่า (30-50 ซม.)</option>
                    <option value="red">🔴 ระดับเอวขึ้นไป (60+ ซม.) - วิกฤต</option>
                </select>

                <!-- ส่วนแสดงปุ่มถ่ายรูป (จะเด้งออกมาเมื่อเลือกระดับวิกฤต) -->
                <div id="photoSection" class="photo-upload-box">
                    <label><i class="fa-solid fa-camera"></i> บังคับถ่ายภาพสถานที่จริง:</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)">
                    <img id="imgPreview" class="img-preview" src="#" alt="ตัวอย่างรูปถ่าย">
                </div>

                <button onclick="savePin(${lat}, ${lng})">บันทึกการปักหมุด</button>
            </div>
        `;

        tempMarker = L.marker([lat, lng]).addTo(map);
        tempMarker.bindPopup(formContent).openPopup();
    });

    // เช็กว่าเลือกเลเวลวิกฤตหรือไม่
    function checkCriticalLevel() {
        const level = document.getElementById('waterLevel').value;
        const photoSection = document.getElementById('photoSection');
        
        if (level === 'red') {
            photoSection.style.display = 'block'; // แสดงกล่องถ่ายรูป
        } else {
            photoSection.style.display = 'none';  // ซ่อนไว้กรณีเป็นระดับอื่น
            currentPhotoData = null;
        }
    }

    // จัดการอ่านรูปและทำ Preview
    function handlePhotoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhotoData = e.target.result;
                const imgPreview = document.getElementById('imgPreview');
                imgPreview.src = currentPhotoData;
                imgPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    // บันทึกปักหมุด
    function savePin(lat, lng) {
        const name = document.getElementById('locationName').value;
        const level = document.getElementById('waterLevel').value;

        if (!name) {
            alert('กรุณากรอกชื่อสถานที่หรือจุดสังเกตครับ');
            return;
        }

        // เช็กความปลอดภัย: ถ้าเป็นระดับวิกฤตแต่ไม่มีรูปถ่าย จะไม่ยอมให้เซฟ
        if (level === 'red' && !currentPhotoData) {
            alert('⚠️ ระดับน้ำวิกฤต ต้องถ่ายภาพยืนยันสถานการณ์จริงก่อนบันทึกครับ!');
            return;
        }

        let levelText = '';
        if (level === 'green') levelText = '🟢 ปกติ / แห้งขอด';
        else if (level === 'yellow') levelText = '🟡 ระดับตาตุ่ม - แข้ง';
        else if (level === 'orange') levelText = '🟠 ระดับเข่า';
        else if (level === 'red') levelText = '🔴 ระดับเอวขึ้นไป (วิกฤต)';

        if (tempMarker) {
            map.removeLayer(tempMarker);
        }

        // แสดงรูปแนบในป๊อปอัปหมุดถาวร (ถ้ามี)
        let photoHTML = '';
        if (currentPhotoData) {
            photoHTML = `<img src="${currentPhotoData}" style="width:100%; height:110px; object-fit:cover; border-radius:8px; margin-top:8px;">`;
        }

        const pin = L.marker([lat, lng]).addTo(map);
        pin.bindPopup(`
            <div style="font-family: 'Prompt', sans-serif; width: 180px;">
                <h3 style="margin:0 0 5px 0; color:#023e8a; font-size:1em;">${name}</h3>
                <p style="margin:0; font-size:0.85em;"><strong>สถานะน้ำ:</strong> ${levelText}</p>
                ${photoHTML}
                <small style="color:#64748b; display:block; margin-top:5px;">ปักหมุดเมื่อ: ${new Date().toLocaleTimeString('th-TH')} น.</small>
            </div>
        `).openPopup();

        alert('บันทึกการปักหมุดเรียบร้อยแล้ว!');
    }
</script>

</body>
</html>
